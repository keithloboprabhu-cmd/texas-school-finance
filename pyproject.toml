[project]
name = "lone-star-ledger"
version = "0.1.0"
description = "Lone Star Ledger: Texas School Finance Atlas"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # long URLs and SQL strings; line length is handled by ruff format

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

tea_peims:
  name: TEA PEIMS actual financial data
  publisher: Texas Education Agency
  landing: https://tea.texas.gov/about-tea/state-funding/state-funding-reports-and-data/peims-financial-data-downloads
  files:
  - name: peims_actuals_summarized_2009_2025.xlsx
    url: https://tea.texas.gov/media/423296
  fallback_landing: https://tea.texas.gov/about-tea/state-funding/state-funding-reports-and-data/peims-single-file-financial-data-downloads
  notes: 'Summarized file (sheet DATAMART) verified: one row per district (incl. charters) and year, YEAR = school-year
    ending year (2025 = 2024-25). Single-file district actuals for 2009-2025 are downloaded by pipeline/ingest/tea_peims.py.
    Code meanings cited from FASRG Update 20.'
  status: verified 2026-11-03
tea_sof:
  name: TEA Summary of Finances (SOF)
  publisher: Texas Education Agency
  landing: https://tea.texas.gov/finance-and-grants/state-funding/foundation-school-program/summary-of-finances
  files: []
  status: 'not used: report app with no bulk download'
  notes: The Summary of Finances is published through TEA's FSP Reports web application (https://tealprod.tea.state.tx.us/Tea.FspReports.Web/),
    one district at a time, with no statewide download. As a result ADA and WADA are not available for every district;
    per-student figures use fall enrollment.
comptroller_pvs:
  name: Comptroller School District Property Value Study (final findings)
  publisher: Texas Comptroller of Public Accounts
  landing: https://comptroller.texas.gov/taxes/property-tax/pvs/2025f/
  files: []
  status: verified 2026-11-03
  notes: Final ISD Worksheet Export Summary for tax years 2022-2025 (earlier years have no export). Used for property
    mix; ASGN T2 equals TEA's 'value assigned' for 98-100% of districts.
tea_recapture:
  name: TEA Excess Local Revenue (recapture) district list
  publisher: Texas Education Agency
  landing: https://tea.texas.gov/about-tea/state-funding/excess-local-revenue
  files: []
  status: verified 2026-11-03
  notes: Recapture Paid by District, 1993-94 to 2026-27 (2025-26 near-final, 2026-27 preliminary per TEA's footnotes);
    Excess Local Revenue lists for 2025-26 (358 districts; PDF COUNT line checked) and 2026-27 (395).

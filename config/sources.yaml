tea_peims:
  name: TEA PEIMS actual financial data
  publisher: Texas Education Agency
  landing: https://tea.texas.gov/about-tea/state-funding/state-funding-reports-and-data/peims-financial-data-downloads
  files:
  - name: peims_actuals_summarized_2009_2025.xlsx
    url: https://tea.texas.gov/media/423296
  fallback_landing: https://tea.texas.gov/about-tea/state-funding/state-funding-reports-and-data/peims-single-file-financial-data-downloads
  notes: We use TEA's summary file (one row per district and year) and the detailed yearly files for 2009-2025.
    Each accounting code is checked against TEA's FASRG Update 20.
  status: checked 2026-11-03
tea_sof:
  name: TEA Summary of Finances (SOF)
  publisher: Texas Education Agency
  landing: https://tea.texas.gov/finance-and-grants/state-funding/foundation-school-program/summary-of-finances
  status: 'not used: no statewide download'
  notes: TEA only publishes the Summary of Finances one district at a time (https://tealprod.tea.state.tx.us/Tea.FspReports.Web/),
    with no statewide file. That's why we don't have ADA or WADA for every district, and why per-student figures
    use fall enrollment.
comptroller_pvs:
  name: Comptroller School District Property Value Study (final findings)
  publisher: Texas Comptroller of Public Accounts
  landing: https://comptroller.texas.gov/taxes/property-tax/pvs/2025f/
  status: checked 2026-11-03
  notes: Final ISD worksheet exports for tax years 2022-2025. Older years have no export. We use them for the mix
    of property types. Their ASGN T2 value matches TEA's value for 98-100% of districts.
tea_recapture:
  name: TEA Excess Local Revenue (recapture) district list
  publisher: Texas Education Agency
  landing: https://tea.texas.gov/about-tea/state-funding/excess-local-revenue
  status: checked 2026-11-03
  notes: Recapture paid by each district, 1993-94 to 2026-27 (2025-26 is near-final and 2026-27 is preliminary,
    per TEA). Also TEA's lists of districts expected to owe recapture for 2025-26 (358 districts, checked against
    the PDF's count) and 2026-27 (395).
tea_tax_rates:
  name: TEA school district adopted M&O and I&S tax rates, 2006-2025
  publisher: Texas Education Agency
  landing: https://tea.texas.gov/about-tea/state-funding/additional-finance-resources/school-district-property-values-and-tax-rates
  files:
  - name: school_district_adopted_tax_rates.xlsx
    url: https://tea.texas.gov/about-tea/state-funding/additional-finance-resources/school-district-adopted-tax-rates-1.xlsx
  status: checked 2026-11-03
  notes: The M&O and I&S rates each district adopted, 2005-06 to 2024-25.
tea_tapr:
  name: TEA Texas Academic Performance Reports (district level)
  publisher: Texas Education Agency
  landing: https://rptsvr1.tea.texas.gov/perfreport/tapr/2024/download.html
  status: checked 2026-11-03
  notes: 2023-24 district profile data. Field codes come from TEA's TAPR data dictionary. The 2024-25 reports aren't
    out yet.
census_saipe:
  name: Census SAIPE school district estimates, 2024 (published file)
  publisher: U.S. Census Bureau
  landing: https://www2.census.gov/programs-surveys/saipe/datasets/2024/2024-school-districts/
  status: checked 2026-11-03
  notes: 2024 estimates from the Census file ussd24.xls. We used the file because the Census API rejected our key.
    Covers 1,017 Texas districts.
census_acs:
  name: Census ACS 2020-2024 5-year estimates by school district (summary file)
  publisher: U.S. Census Bureau
  landing: https://www2.census.gov/programs-surveys/acs/summary_file/2024/table-based-SF/
  status: checked 2026-11-03
  notes: 2020-2024 ACS 5-year summary tables B19013, B25077 and B01003 for school districts. The Census caps median
    income at $250,000.
nces_boundaries:
  name: NCES EDGE School District Composites SY 2024-25 (TL 2025)
  publisher: National Center for Education Statistics
  landing: https://catalog.data.gov/dataset/school-district-composites-sy-2024-25-tl-25
  status: checked 2026-11-03
  notes: 'School district boundaries for Texas: 1,016 unified districts, 1 elementary and 1 secondary.'
nces_school_points:
  name: NCES EDGE public school locations 2024-25
  publisher: National Center for Education Statistics
  landing: https://catalog.data.gov/dataset/public-school-locations-2024-25
  status: checked 2026-11-03
  notes: School locations for 2015-16 to 2024-25 (2014-15 isn't posted). A new campus is a school ID that first
    appears after 2015-16.
nces_ccd_lea:
  name: NCES Common Core of Data LEA directory (CDN <-> LEAID crosswalk)
  publisher: National Center for Education Statistics
  landing: https://nces.ed.gov/ccd/files.asp
  status: checked 2026-11-03
  notes: The 2023-24 district directory (ccd_lea_029_2324_w_1a_073124). Its ST_LEAID is "TX-" plus TEA's CDN, which
    is how we match federal and state IDs.
brb_bond_elections:
  name: Texas Bond Review Board local bond elections (school districts)
  publisher: Texas Bond Review Board
  landing: https://debtsearch.brb.texas.gov/bond_elections_search.aspx
  discovery: https://api.us.socrata.com/api/catalog/v1?domains=data.texas.gov&q=bond%20review%20board
  notes: The Texas Open Data Portal entry (djkj-euda) only links to the Bond Review Board's search site and was
    last updated in 2017. We'll add bond elections once we can reach debtsearch.brb.texas.gov or get an export.
  status: 'not available: debtsearch.brb.texas.gov couldn''t be reached'
brb_debt:
  name: Texas Bond Review Board Data Center ISD debt pages
  publisher: Texas Bond Review Board
  landing: https://data.texas.gov/d/3qmf-seku
  notes: Debt owed by each school district, fiscal years 2016-2025 (data updated 2026-09-10), plus the Data Center's
    CAB and CIB files for each district. The Bond Review Board's govid is the CDN (for example 037-901-02). We checked
    all 947 matches by hand.
  status: checked 2026-11-03
fred_cpi:
  name: CPI-U, all items (CPIAUCSL)
  publisher: Federal Reserve Bank of St. Louis (FRED), from BLS
  landing: https://fred.stlouisfed.org/series/CPIAUCSL
  status: checked 2026-11-03
  notes: Downloaded from FRED, with a saved copy as a backup. We average it July to June for each school year.
tea_cptd:
  name: Comptroller certified school district property values (PTAD Tax Final), posted by TEA
  publisher: Texas Comptroller of Public Accounts, via Texas Education Agency
  landing: https://tea.texas.gov/about-tea/state-funding/additional-finance-resources/school-district-property-values-and-tax-rates
  notes: Tax years 2010-2025, using the value TEA marks as used for school funding. TEA's link for tax year 2009
    is broken. The tax year 2022 file lists 966 districts; we fill in the other 48 from the Comptroller's Property
    Value Study.
  status: checked 2026-11-03
tea_askted:
  name: TEA AskTED school and district directory
  publisher: Texas Education Agency
  landing: https://tealprod.tea.state.tx.us/Tea.AskTed.Web/Forms/DownloadFile.aspx
  status: checked 2026-11-03
  notes: District type, regional service center (ESC) region, federal IDs and campus opening dates.
census_cb:
  name: Census cartographic boundary files 2024 (counties, CBSAs, state)
  publisher: U.S. Census Bureau
  landing: https://www2.census.gov/geo/tiger/GENZ2024/shp/
  status: checked 2026-11-03
  notes: 'Used only for map outlines: counties, metro areas and the state border.'
tea_fsr:
  name: TEA PEIMS Financial Standard Reports (Actual PWR workbooks)
  publisher: Texas Education Agency
  landing: https://tea.texas.gov/about-tea/state-funding/state-funding-reports-and-data/peims-financial-standard-reports
  status: checked 2026-11-03
  notes: Used to check our totals (2016-17, 2020-21 and 2024-25) and five individual districts.
tea_fasrg:
  name: TEA Financial Accountability System Resource Guide, Update 20 (FAR Appendices)
  publisher: Texas Education Agency
  landing: https://tea.texas.gov/data-reports/financial-compliance/financial-accountability-system-resource-guide
  status: checked 2026-11-03
  notes: The source for every fund, function and object code.

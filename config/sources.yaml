tea_peims:
  name: TEA PEIMS actual financial data
  publisher: Texas Education Agency
  landing: https://tea.texas.gov/about-tea/state-funding/state-funding-reports-and-data/peims-financial-data-downloads
  files:
  - name: peims_actuals_summarized_2009_2025.xlsx
    url: https://tea.texas.gov/media/423296
  fallback_landing: https://tea.texas.gov/about-tea/state-funding/state-funding-reports-and-data/peims-single-file-financial-data-downloads
  notes: 'Summarized file (sheet DATAMART) verified: one row per district (incl. charters) and year, YEAR = school-year
    ending year (2025 = 2024-25). Single-file district actuals for 2009-2025 are downloaded by pipeline/ingest/tea_peims.py.
    Code meanings cited from FASRG Update 20.'
  status: verified 2026-11-03
tea_sof:
  name: TEA Summary of Finances (SOF)
  publisher: Texas Education Agency
  landing: https://tea.texas.gov/finance-and-grants/state-funding/foundation-school-program/summary-of-finances
  files: []
  status: 'not used: report app with no bulk download'
  notes: The Summary of Finances is published through TEA's FSP Reports web application (https://tealprod.tea.state.tx.us/Tea.FspReports.Web/),
    one district at a time, with no statewide download. As a result ADA and WADA are not available for every district;
    per-student figures use fall enrollment.
comptroller_pvs:
  name: Comptroller School District Property Value Study (final findings)
  publisher: Texas Comptroller of Public Accounts
  landing: https://comptroller.texas.gov/taxes/property-tax/pvs/2025f/
  files: []
  status: verified 2026-11-03
  notes: Final ISD Worksheet Export Summary for tax years 2022-2025 (earlier years have no export). Used for property
    mix; ASGN T2 equals TEA's 'value assigned' for 98-100% of districts.
tea_recapture:
  name: TEA Excess Local Revenue (recapture) district list
  publisher: Texas Education Agency
  landing: https://tea.texas.gov/about-tea/state-funding/excess-local-revenue
  files: []
  status: verified 2026-11-03
  notes: Recapture Paid by District, 1993-94 to 2026-27 (2025-26 near-final, 2026-27 preliminary per TEA's footnotes);
    Excess Local Revenue lists for 2025-26 (358 districts; PDF COUNT line checked) and 2026-27 (395).
tea_tax_rates:
  name: TEA school district adopted M&O and I&S tax rates, 2006-2025
  publisher: Texas Education Agency
  landing: https://tea.texas.gov/about-tea/state-funding/additional-finance-resources/school-district-property-values-and-tax-rates
  files:
  - name: school_district_adopted_tax_rates.xlsx
    url: https://tea.texas.gov/about-tea/state-funding/additional-finance-resources/school-district-adopted-tax-rates-1.xlsx
  status: verified 2026-11-03
  notes: Adopted M&O and I&S rates by school year, 2005-06 to 2024-25.
tea_tapr:
  name: TEA Texas Academic Performance Reports (district level)
  publisher: Texas Education Agency
  landing: https://rptsvr1.tea.texas.gov/perfreport/tapr/2024/download.html
  files: []
  status: verified 2026-11-03
  notes: 2023-24 district profile (Advanced Download, PROF); codes from TEA's TAPR data dictionary. 2024-25 not
    yet published.
census_saipe:
  name: Census SAIPE school district estimates (API)
  publisher: U.S. Census Bureau
  landing: https://www2.census.gov/programs-surveys/saipe/datasets/2024/2024-school-districts/
  status: verified 2026-11-03
  notes: 2024 estimates from Census's published file ussd24.xls (the Data API key was rejected as invalid). 1,017
    Texas districts.
census_acs:
  name: Census ACS 5-year estimates by school district (API)
  publisher: U.S. Census Bureau
  landing: https://www2.census.gov/programs-surveys/acs/summary_file/2024/table-based-SF/
  status: verified 2026-11-03
  notes: 2020-2024 ACS 5-year table-based summary files B19013, B25077, B01003; summary levels 950/960/970. Median
    income is top-coded at 250,000+.
nces_boundaries:
  name: NCES EDGE School District Composites SY 2024-25 (TL 2025)
  publisher: National Center for Education Statistics
  landing: https://catalog.data.gov/dataset/school-district-composites-sy-2024-25-tl-25
  files:
  - name: EDGE_SCHOOLDISTRICT_TL25_SY2425.zip
    url: https://nces.ed.gov/programs/edge/data/EDGE_SCHOOLDISTRICT_TL25_SY2425.zip
  status: not yet downloaded
nces_school_points:
  name: NCES EDGE public school locations 2024-25
  publisher: National Center for Education Statistics
  landing: https://catalog.data.gov/dataset/public-school-locations-2024-25
  files: []
  status: verified 2026-11-03
  notes: EDGE public school geocodes 2015-16 to 2024-25 (2014-15 not posted). New campus = NCES school ID first
    appearing in a year after 2015-16.
nces_ccd_lea:
  name: NCES Common Core of Data LEA directory (CDN <-> LEAID crosswalk)
  publisher: National Center for Education Statistics
  landing: https://nces.ed.gov/ccd/files.asp
  files: []
  status: verified 2026-11-03
  notes: CCD LEA directory 2023-24 (ccd_lea_029_2324_w_1a_073124); ST_LEAID = 'TX-' + CDN.
brb_bond_elections:
  name: Texas Bond Review Board local bond elections (school districts)
  publisher: Texas Bond Review Board
  landing: https://debtsearch.brb.texas.gov/bond_elections_search.aspx
  discovery: https://api.us.socrata.com/api/catalog/v1?domains=data.texas.gov&q=bond%20review%20board
  notes: The Open Data Portal entry 'Local Debt Bond Election Results' (djkj-euda) is only a link to the BRB search
    site; its metadata was last updated in 2017. Bond election analysis is pending access to debtsearch.brb.texas.gov
    or an export.
  status: 'BLOCKED: debtsearch.brb.texas.gov not reachable from the build environment'
brb_debt:
  name: Texas Bond Review Board Data Center ISD debt pages
  publisher: Texas Bond Review Board
  landing: https://data.texas.gov/d/3qmf-seku
  notes: Debt Outstanding By Issuance Local By Year (data updated 2026-09-10), ISD rows FY2016-FY2025; BRB Data
    Center CAB/CIB CSVs per district. BRB govid = CDN (e.g. 037-901-02); 947/947 issuers hand-reviewed in data/qa/brb_crosswalk_review.csv.
  status: verified 2026-11-03
fred_cpi:
  name: CPI-U, all items (CPIAUCSL)
  publisher: Federal Reserve Bank of St. Louis (FRED), from BLS
  landing: https://fred.stlouisfed.org/series/CPIAUCSL
  files: []
  status: verified 2026-11-03
  notes: FRED API with key; committed snapshot data/ref/cpi_cpiaucsl_monthly.csv as fallback. School-year average
    = July-June.
tea_cptd:
  name: Comptroller certified school district property values (PTAD Tax Final), posted by TEA
  publisher: Texas Comptroller of Public Accounts, via Texas Education Agency
  landing: https://tea.texas.gov/about-tea/state-funding/additional-finance-resources/school-district-property-values-and-tax-rates
  notes: Tax years 2010-2025; column '<year> value assigned (used for school funding)'. The tax year 2009 link returns
    'Page not found'. TEA's tax year 2022 file lists 966 districts; the other 48 are filled from the Comptroller
    PVS (ASGN T2).
  status: verified 2026-11-03
tea_askted:
  name: TEA AskTED school and district directory
  publisher: Texas Education Agency
  landing: https://tealprod.tea.state.tx.us/Tea.AskTed.Web/Forms/DownloadFile.aspx
  status: verified 2026-11-03
  notes: District type, ESC region, NCES IDs, campus status dates.
census_cb:
  name: Census cartographic boundary files 2024 (counties, CBSAs, state)
  publisher: U.S. Census Bureau
  landing: https://www2.census.gov/geo/tiger/GENZ2024/shp/
  status: verified 2026-11-03
  notes: Map overlays only.
tea_fsr:
  name: TEA PEIMS Financial Standard Reports (Actual PWR workbooks)
  publisher: Texas Education Agency
  landing: https://tea.texas.gov/about-tea/state-funding/state-funding-reports-and-data/peims-financial-standard-reports
  status: verified 2026-11-03
  notes: Used for reconciliation (2016-17, 2020-21, 2024-25) and district spot checks.
tea_fasrg:
  name: TEA Financial Accountability System Resource Guide, Update 20 (FAR Appendices)
  publisher: Texas Education Agency
  landing: https://tea.texas.gov/data-reports/financial-compliance/financial-accountability-system-resource-guide
  status: verified 2026-11-03
  notes: Source for every fund, function and object code.

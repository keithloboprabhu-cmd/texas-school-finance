  status: not yet downloaded

tea_tapr:
  name: TEA Texas Academic Performance Reports (district level)
  publisher: Texas Education Agency
  landing: https://rptsvr1.tea.texas.gov/perfreport/tapr/2024/download.html
  files: []   # district-level comma-delimited downloads; pattern /perfreport/tapr/<year>/
  status: not yet downloaded


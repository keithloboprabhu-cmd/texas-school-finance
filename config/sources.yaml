# Registry of every external data source used by the pipeline.
# `files` are fetched by `python -m pipeline.ingest.fetch` into data/raw/<source>/.
# `status` records what has been verified *from the file itself* (not from documentation).
# Nothing below is used in a transform until its fields are confirmed against the downloaded file
# or its official data dictionary.

tea_peims:
  name: TEA PEIMS actual financial data
  publisher: Texas Education Agency
  landing: https://tea.texas.gov/about-tea/state-funding/state-funding-reports-and-data/peims-financial-data-downloads
  files:
    - {name: peims_actuals_summarized_2009_2025.xlsx, url: "https://tea.texas.gov/media/423296"}
  fallback_landing: https://tea.texas.gov/about-tea/state-funding/state-funding-reports-and-data/peims-single-file-financial-data-downloads
  notes: >-
    Summarized file (sheet DATAMART) verified: one row per district (incl. charters) and year,
    YEAR = school-year ending year (2025 = 2024-25). Single-file district actuals for 2009-2025 are
    downloaded by pipeline/ingest/tea_peims.py. Code meanings cited from FASRG Update 20.
  status: verified 2026-11-03

tea_sof:
  name: TEA Summary of Finances (SOF)
  publisher: Texas Education Agency
  landing: https://tea.texas.gov/finance-and-grants/state-funding/foundation-school-program/summary-of-finances
  files: []   # file links are listed on the landing page; record them here once confirmed
  status: not yet downloaded

comptroller_pvs:
  name: Comptroller School District Property Value Study (final findings)
  publisher: Texas Comptroller of Public Accounts
  landing: https://comptroller.texas.gov/taxes/property-tax/pvs/2025f/
  files: []   # "ISD Worksheet Export" XLSX links per year (/pvs/2025f, /pvs/2024f, ...)
  status: not yet downloaded

tea_recapture:
  name: TEA Excess Local Revenue (recapture) district list
  publisher: Texas Education Agency
  landing: https://tea.texas.gov/about-tea/state-funding/excess-local-revenue
  files:
    - {name: excess_local_revenue_2025_26.pdf, url: "https://tea.texas.gov/finance-and-grants/state-funding/excess-local-revenue/2025-2026-excess-local-revenue-districts.pdf"}
  status: not yet downloaded

tea_tax_rates:

layers:
  wealth:
    theme: Wealth
    label: Taxable property per student
    column: wealth_per_student
    fmt: money_k
    palette: sequential
    read: How much taxable property sits behind each student; the base a district can tax. Darker = more.
  income:
    theme: Wealth
    label: Typical household income
    column: median_household_income
    fmt: money_k
    palette: sequential
    read: Median income of households living in the district (Census, 2020-2024). Capped by the Census at $250,000.
  mineral:
    theme: Wealth
    label: Share of property that is oil, gas and minerals
    column: mineral_share
    fmt: pct
    palette: sequential
    read: How much of the district's tax base is oil, gas and other minerals rather than homes or businesses.
  spending:
    theme: Spending
    label: Spending per student
    column: op_per_student
    fmt: money
    palette: diverging
    read: Day-to-day spending per student compared with the Texas median. Clay = above, teal = below. Excludes debt
      payments, construction and money sent to the state.
  residual:
    theme: Spending
    label: Spending vs. similar districts
    column: std_residual
    fmt: num
    palette: diverging
    read: Clay = spends more than districts with similar wealth, size, student needs and setting; teal = spends
      less.
  recapture:
    theme: Recapture
    label: Money sent to the state per student
    column: recapture_per_student
    fmt: money
    palette: sequential
    read: Local property-tax money a wealthy district must send to the state ("recapture"), per student. Gray =
      sends none.
  debt:
    theme: Debt
    label: Debt per student
    column: debt_per_student
    fmt: money_k
    palette: sequential
    read: Voter-approved school debt still owed at the end of the last fiscal year, per student.
  is_rate:
    theme: Debt
    label: Debt tax rate
    column: is_rate
    fmt: rate
    palette: sequential
    read: The part of the school property tax that repays bonds (the "I&S" rate), in dollars per $100 of property
      value.
  cab:
    theme: Debt
    label: Share of debt in deferred-interest bonds
    column: cab_share
    fmt: pct
    palette: sequential
    read: Share of debt in capital appreciation bonds (CABs), which put off all interest until the end and cost
      more.
  growth:
    theme: Growth
    label: Enrollment change, 5 years
    column: growth_5y
    fmt: pct
    palette: diverging_zero
    read: How much enrollment grew (clay) or shrank (teal) over five years.
  new_campuses:
    theme: Growth
    label: New campuses since 2016-17
    column: new_campuses
    fmt: num
    palette: sequential
    read: Schools that first opened in 2016-17 or later and are still open.
  poverty:
    theme: Need
    label: Children in poverty
    column: child_poverty_rate
    fmt: pct
    palette: sequential
    read: Share of children aged 5-17 living below the poverty line (Census estimate, 2024).
  econ:
    theme: Need
    label: Students from low-income families
    column: econ_disadv_pct
    fmt: pct
    palette: sequential
    read: Share of students TEA counts as economically disadvantaged, mostly those eligible for free or reduced-price
      meals (2023-24).
